services:
  auth-service:
    build: ./services/auth-service

  task-service:
    build: ./services/task-service

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      TASK_SERVICE_URL: ${TASK_SERVICE_URL}
    depends_on:
      - auth-service
      - task-service
