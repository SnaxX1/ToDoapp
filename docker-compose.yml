services:
  auth-service:
    build: ./services/auth-service

  task-service:
    build: ./services/task-service

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:5001
      TASK_SERVICE_URL: http://task-service:5002
    depends_on:
      - auth-service
      - task-service
