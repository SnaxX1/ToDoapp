services:
  auth-service:
    build: ./services/auth-service
    ports:
      - "5001:5001"
    environment:
      PORT: 5001

  task-service:
    build: ./services/task-service
    ports:
      - "5002:5002"
    environment:
      PORT: 5002

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:5001
      TASK_SERVICE_URL: http://task-service:5002
